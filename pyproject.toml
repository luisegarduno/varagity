[project]
name = "varagity"
version = "0.1.0"
description = "Full-stack RAG application with Contextual Retrieval — self-hosted, GPU-accelerated"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # PDF extraction (structure-aware markdown) + OCR fallback. The easyocr
    # extra is required since docling 2.98 split OCR engines out of the
    # standard bundle; tesseract needs only the system binary (Dockerfile).
    "docling[easyocr]>=2.112.0",
    "elasticsearch>=9,<10", # client major must match the ES server major (9.x ↔ 9.x)
    # Native SSE (EventSourceResponse landed in 0.135) — v2 plan decision #7.
    "fastapi>=0.135",
    "httpx>=0.28.1",
    "langchain-core>=1.4.9",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.45.0",
    "pgvector>=0.5.0",
    # OpenDocument ingestion (.odt/.ods/.odp): docling's opendocument
    # backend imports odfdo lazily and raises without it — declared
    # directly (docling's own extra is on the docling-slim package).
    "odfdo>=3.9",
    # Page-preview locate/render (varagity/preview, ADR-010): declared
    # directly so the feature survives docling changing its backend deps —
    # both are already in the resolved set transitively (no image growth).
    "pillow>=11",
    "prefect>=3,<4",
    # In-app pipeline metrics exposed at GET /metrics (spec_v2 §6).
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pypdfium2>=5.11,<6",  # page-preview locate/render (see the pillow note above)
    # Multipart form parsing for the upload route (FastAPI requires it
    # at import time for File/UploadFile parameters).
    "python-multipart>=0.0.20",
    # Pure-Python typedstream decoder for iMessage attributedBody blobs
    # (varagity.graph.sources.imessage, spec_graphrag §10.1) — tiny, LGPL,
    # imported as a library. PyPI name pytypedstream, import name typedstream.
    "pytypedstream>=0.1.0",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    # Declared directly (not just via docling[easyocr]) so the [tool.uv.sources]
    # CPU-wheel pin below applies — uv sources only bind to declared deps.
    "torch>=2.6",
    "torchvision>=0.21",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "mypy>=2.2.0",
    "neoteroi-mkdocs>=1.2.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.21",
    { include-group = "eval" },
]
# What `main.py eval` needs beyond the runtime deps: ephemeral
# stores + OCR error metrics. Shared into dev (tests use the same
# containers); `uv run --group eval main.py eval` works without dev.
eval = [
    "jiwer>=3.1.0",
    "testcontainers[elasticsearch,postgres]>=4.14.2",
]
# The three ADR-017 bake-off engines (spec_graphrag §8). Deliberately NOT
# included in `dev`: CI installs dev only, so this group's weight never
# reaches the pipeline. The adapters in varagity/graph/engines import these
# libs *inside* `session()` (plan decision #8), so the registry costs nothing
# without them — `tests/unit/test_graph_engines.py` enforces that.
# Local use: `uv run --group bakeoff main.py eval graph`,
# `uv run --group bakeoff pytest -m bakeoff`.
#
# The three DO co-resolve (plan decision #8's per-engine-group fallback is
# not needed), but uv locks one version per package across every group, so
# their transitive caps pull five shared packages down from what the app
# alone would pick: pandas 3.0.3→2.3.3 and packaging 26.2→24.2 (lightrag-hku),
# websockets 16.0→15.0.1 and jiter 0.16.0→0.13.0 (cognee, the latter via
# instructor), redis 8.0.1→7.4.1 (graphiti-core/falkordb). None is imported by
# varagity itself — they reach us through docling (pandas), uvicorn/prefect
# (websockets), openai (jiter) and prefect's optional docket backend (redis) —
# and all five resolved versions are ones those packages declare support for.
# The isolation alternative, if that ever stops being acceptable, is
# `[tool.uv] conflicts` between `dev` and `bakeoff` (two resolution forks,
# production untouched) at the cost of duplicating pytest into this group and
# running every bake-off command with `--no-dev`.
bakeoff = [
    "lightrag-hku>=1.5.4",
    "cognee>=1.4.0",
    "graphiti-core[falkordblite]>=0.29.2",
]

# cognee 1.4.0 → instructor <1.15.3 → `rich>=13.7,<15`, which collides with
# this project's own `rich>=15`. The collision is between the bakeoff group
# and a *main* dependency, so `[tool.uv] conflicts` (which forks group
# resolutions but shares the project's own requirements) cannot express it —
# the only knobs are downgrading the app's rich for everyone or overriding
# the transitive bound. instructor uses rich solely for its optional CLI
# pretty-printer (never reached from cognee's extraction path), so the
# override is the contained choice: the app keeps rich 15 and the bake-off
# gets its engines. Delete this line when the loser adapters are removed in
# stage 2 (plan decision #14) if the winner is not cognee.
[tool.uv]
override-dependencies = ["rich>=15.0.0"]

# v1 OCR runs on CPU (plan decision #10), so pull CPU-only torch wheels for
# docling/EasyOCR — the default CUDA wheels add multiple GB to the venv/image
# for GPU inference the app container can't use anyway.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W/F = pycodestyle + Pyflakes (flake8 parity), I = isort, B = bugbear,
# SIM = simplify, UP = pyupgrade, D = pydocstyle (docstring enforcement).
select = ["E", "W", "F", "I", "B", "SIM", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't need docstrings on every function/module.
"tests/**" = ["D1"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# Ships no py.typed marker; imported (deferred) by varagity.eval.containers.
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ships no py.typed marker; the varagity.preview pdfium wrappers keep the
# untyped surface contained behind their own typed signatures.
module = ["pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Ships no py.typed marker; the iMessage attributedBody decoder
# (varagity.graph.sources.imessage) keeps the untyped surface behind its own
# typed signatures.
module = ["typedstream.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The `bakeoff` dependency group (ADR-017 candidates), which CI never
# installs — the adapters import them lazily inside `session()` and keep the
# untyped surface behind their own typed signatures.
module = ["lightrag.*", "cognee.*", "graphiti_core.*", "redislite.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Async tests (the httpx.AsyncClient API suites) run under pytest-asyncio
# without per-test markers.
asyncio_mode = "auto"
markers = [
    "integration: needs real backing services via testcontainers (Docker)",
    "e2e: full ingest→query pipeline over the fixtures corpus (Docker)",
    "bakeoff: needs the graph engines (--group bakeoff) and the live GPU services",
]
# Default run is unit-only; select the other layers with `-m integration` /
# `-m e2e` / `-m bakeoff` (the last also needs `uv run --group bakeoff`).
addopts = "--cov=varagity --cov-report=term-missing -m 'not integration and not e2e and not bakeoff'"

[tool.coverage.report]
# Ratcheted from the spec §15.3 floor of 80 as coverage grew (unit suite ~93%).
fail_under = 90
